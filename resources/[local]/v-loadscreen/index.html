<!DOCTYPE html>
<html lang="fr">
<head>

  <link rel="stylesheet" href="web/style.css">

<body>

  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.2 10.4h17.6M3.2 13.6h17.6"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/></symbol>

  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6.6V12l3.7 2.3"/></symbol>
  <symbol id="i-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6 18.4 18.4"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.4s-7.6-4.7-7.6-9.7a4.35 4.35 0 0 1 7.6-2.9 4.35 4.35 0 0 1 7.6 2.9c0 5-7.6 9.7-7.6 9.7Z"/></symbol>

<div id="app" class="app is-booting">

  <!-- ── background stack ─────────────────────────────────────────── -->
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div class="aurora" id="aurora" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>
  <div class="flash" id="flash" aria-hidden="true"></div>
  <div class="beam" id="beam" aria-hidden="true"></div>
  <div class="scrim" id="scrim" aria-hidden="true"></div>
  <div class="grain" id="grain" aria-hidden="true"></div>
  <div class="scanlines" id="scanlines" aria-hidden="true"></div>
  <div class="vignette" id="vignette" aria-hidden="true"></div>
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
  <div class="frame" id="frame" aria-hidden="true">
    <span class="fc tl"></span><span class="fc tr"></span>
    <span class="fc bl"></span><span class="fc br"></span>
  </div>

  <!-- ── top hud ──────────────────────────────────────────────────── -->
  <header class="hud hud-top">
    <div class="pill server-pill" id="serverPill" hidden>
      <span class="pulse-dot"></span>
      <span class="pill-name" id="pillName"></span>
      <span class="pill-sep" id="pillSep" hidden></span>
      <span class="pill-players" id="pillPlayers" hidden>
        <b id="playerCount">--</b><span id="playerMax"></span>
        <i id="playersLabel"></i>
      </span>
    </div>

    <div class="top-right">
      <!-- music player -->
      <div class="player" id="player" hidden>
        <button class="icon-btn player-toggle" id="playerToggle" type="button" title="">
          <svg class="ico"><use href="#i-volume"></use></svg>
        </button>
        <div class="player-body" id="playerBody">
          <div class="spectrum" id="spectrum" aria-hidden="true"></div>
          <div class="player-meta">
            <span class="track-title" id="trackTitle">--</span>
            <span class="track-artist" id="trackArtist"></span>
          </div>
          <div class="player-controls">
            <button class="icon-btn sm" id="btnPrev" type="button" title=""><svg class="ico"><use href="#i-prev"></use></svg></button>
            <button class="icon-btn sm accent" id="btnPlay" type="button" title=""><svg class="ico"><use href="#i-pause"></use></svg></button>
            <button class="icon-btn sm" id="btnNext" type="button" title=""><svg class="ico"><use href="#i-next"></use></svg></button>
            <button class="icon-btn sm" id="btnMute" type="button" title=""><svg class="ico"><use href="#i-volume"></use></svg></button>
            <div class="slider" id="volSlider" title="">
              <div class="slider-rail"><div class="slider-fill" id="volFill"></div><div class="slider-knob" id="volKnob"></div></div>
            </div>
            <span class="vol-value" id="volValue">35</span>
          </div>
        </div>
      </div>

      <button class="icon-btn settings-btn" id="settingsBtn" type="button" title="" hidden>
        <svg class="ico"><use href="#i-settings"></use></svg>
      </button>
    </div>
  </header>

  <!-- ── centre stage ─────────────────────────────────────────────── -->
  <main class="stage" id="stage">
    <div class="logo-wrap" id="logoWrap">
      <span class="halo"></span>
      <span class="wave"></span>
      <img class="logo" id="logo" alt="" hidden>
      <span class="logo-sheen"><i></i></span>
    </div>
    <h1 class="server-name" id="serverName" aria-live="polite"></h1>
    <p class="tagline" id="tagline"></p>
  </main>

  <!-- ── bottom hud ───────────────────────────────────────────────── -->
  <footer class="hud hud-bottom">
    <div class="cards">
      <section class="card tip-card" id="tipCard" hidden>
        <div class="tip-icon"><svg class="ico" id="tipIcon"><use href="#i-bulb"></use></svg></div>
        <div class="tip-body">
          <div class="tip-head">
            <span class="tip-label" id="tipLabel"></span>
            <span class="tip-cat" id="tipCat"></span>
          </div>
          <p class="tip-text" id="tipText"></p>
        </div>
        <svg class="tip-timer" viewBox="0 0 36 36" aria-hidden="true">
          <circle class="tip-timer-bg" cx="18" cy="18" r="15.5"></circle>
          <circle class="tip-timer-fg" id="tipTimer" cx="18" cy="18" r="15.5"></circle>
        </svg>
      </section>

      <section class="card keys-card" id="keysCard" hidden>
        <div class="card-title"><svg class="ico"><use href="#i-bolt"></use></svg><span id="keysTitle"></span></div>
        <div class="keys" id="keys"></div>
      </section>
    </div>

    <div class="progress-block">
      <div class="progress-head">
        <span class="stage-label" id="stageLabel"></span>
        <span class="percent" id="percent"><b id="percentValue">0</b><i>%</i></span>
      </div>
      <div class="stage-dots" id="stageDots" hidden></div>
      <div class="rail">
        <div class="rail-glow"></div>
        <div class="fill" id="fill"><span class="comet"></span></div>
      </div>
      <div class="progress-foot">
        <span class="logline" id="logline"></span>
        <nav class="links" id="links"></nav>
      </div>
    </div>
  </footer>

  <!-- ── settings panel ───────────────────────────────────────────── -->
  <div class="settings-scrim" id="settingsScrim" hidden></div>
  <aside class="settings" id="settings" hidden>
    <div class="settings-head">
      <h2 id="settingsTitle"></h2>
      <button class="icon-btn sm" id="settingsClose" type="button" title=""><svg class="ico"><use href="#i-close"></use></svg></button>
    </div>
    <div class="settings-body" id="settingsBody"></div>
  </aside>

  <!-- ── ready overlay ────────────────────────────────────────────── -->
  <div class="ready" id="ready" hidden>
    <button class="enter-btn" id="enterBtn" type="button">
      <span class="enter-glow"></span>
      <span class="enter-label" id="enterLabel"></span>
    </button>
  </div>

  <!-- ── intro curtain ────────────────────────────────────────────── -->
  <div class="curtain" id="curtain" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script src="config.js" charset="utf-8"></script>
<script src="web/app.js" charset="utf-8"></script>
</body>
</html>
