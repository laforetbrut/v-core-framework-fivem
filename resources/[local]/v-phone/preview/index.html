<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>v-phone — Preview</title>
  <base href="../html/">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Keep this preview DOM in sync with the production NUI while developing. -->
  <script>
    fetch('index.html').then(function (response) { return response.text(); }).then(function (html) {
      var body = html.match(/<body[^>]*>([\s\S]*?)<script src="sdk\.js"><\/script>/i);
      if (!body) return;
      document.body.innerHTML = body[1];
      var sdk = document.createElement('script');
      sdk.src = 'sdk.js';
      sdk.onload = function () {
        var app = document.createElement('script');
        app.src = 'app.js';
        app.onload = function () {
          var fixture = document.createElement('script');
          fixture.src = '../preview/fixture.js';
          document.body.appendChild(fixture);
        };
        document.body.appendChild(app);
      };
      document.body.appendChild(sdk);
    });
  </script>
</body>
</html>
