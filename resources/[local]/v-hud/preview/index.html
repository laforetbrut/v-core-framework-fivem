<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>v-hud preview</title>
    <link rel="stylesheet" href="../html/css/reset.css?v=1795238409">
    <link rel="stylesheet" href="../html/css/themes.css?v=1795238409">
    <link rel="stylesheet" href="../html/css/hud.css?v=1795238409">
    <link rel="stylesheet" href="../html/css/status.css?v=1795238409">

    <style>
/* Preview chrome only. None of this ships. */
html, body { pointer-events: auto; }
body {
    background:
        radial-gradient(1200px 700px at 22% 78%, #2a1140 0%, transparent 60%),
        radial-gradient(900px 600px at 78% 22%, #10304a 0%, transparent 55%),
        linear-gradient(160deg, #090a12 0%, #16091f 55%, #05070d 100%);
}
/* A stand-in for the game minimap, drawn from the SAME --map-* variables the real frame and
   the docked elements use. That is the point: if the placeholder and the border disagree
   here, they disagree in game too. */
body::after {
    content: 'MINIMAP';
    position: fixed;
    left: var(--map-left);
    bottom: var(--map-bottom);
    width: var(--map-w);
    height: var(--map-h);
    display: flex; align-items: center; justify-content: center;
    background: repeating-linear-gradient(45deg, #1d2733 0 12px, #232f3d 12px 24px);
    color: rgba(255,255,255,0.35); font-size: 12px; letter-spacing: 0.3em;
    z-index: 1;
    border-radius: var(--map-radius, 0);
}
/* The toolbar sits at the BOTTOM. At the top it covered the compass, the money row and the
   whole top third of the HUD, which is exactly the part a preview exists to show. */
#preview-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 999;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 14px; background: #0d0f16; border-bottom: 1px solid #262b3a;
    font: 12px/1.4 system-ui, sans-serif; color: #cbd5e1; pointer-events: auto;
}
#preview-bar label { display: flex; align-items: center; gap: 5px; }
#preview-bar select, #preview-bar button {
    background: #1a1f2e; color: #e2e8f0; border: 1px solid #2f3648;
    border-radius: 4px; padding: 3px 7px; font: inherit;
}
#preview-bar button { cursor: pointer; }
</style>
</head>
<body>


<!--
    Paint servers shared by every instrument.

    speedo.css strokes the chrome bezels with url(#chromeGradient), and an SVG fragment
    reference resolves against the WHOLE document, not the SVG it sits in. Defining the
    gradient inside each built face therefore put a dozen identical ids in the page, and
    whichever one happened to be first won - including one inside a menu preview card that the
    next tab change deleted, which silently unpainted the live cluster's bezel.

    One definition, in a node nothing ever removes, and the reference cannot dangle.
-->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <defs>
        <linearGradient id="chromeGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f6f6f4"/>
            <stop offset="42%" stop-color="#8c8c88"/>
            <stop offset="58%" stop-color="#dedad2"/>
            <stop offset="100%" stop-color="#5f5f5c"/>
        </linearGradient>
    </defs>
</svg>

<!--
    Three layers, and they are separate on purpose.

    #hud        always mounted, never given pointer events. Everything the player sees while
                playing lives here.
    #layout     the drag editor. Sits over the HUD, takes pointer events, and shows a ghost
                of every element so one can be dragged.
    #menu       the settings panel. Takes focus; the HUD keeps drawing behind it so a change
                is visible the moment it is made.
-->

<div id="hud" class="hud" data-ready="false">

    <!-- Cinematic bars. Transformed rather than resized: a height animation relayouts the
         page on every frame, a transform does not. -->
    <div class="cinebar cinebar--top" id="cine-top"></div>
    <div class="cinebar cinebar--bottom" id="cine-bottom"></div>

    <!-- The minimap border. The map itself is the game's; this is only the frame around it,
         because the native one cannot be recoloured. -->
    <div class="minimap-frame" id="minimap-frame" data-shape="square" data-radar="true"></div>
    <div class="route-distance" id="route-distance" data-radar="true" data-route="false" aria-live="off">
        <svg class="route-distance__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 18a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm14-10a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM7 16h5a4 4 0 0 0 0-8h-1M11 8h6"/>
        </svg>
        <span class="route-distance__label" id="route-label"></span>
        <span class="route-distance__value" id="route-value"></span>
    </div>

    <div class="hud-el" id="el-status" data-element="status">
        <div class="status" id="status-list"></div>
    </div>

    <div class="hud-el" id="el-speedo" data-element="speedo">
        <div class="speedo" id="speedo"></div>
    </div>

    <div class="hud-el" id="el-compass" data-element="compass">
        <div class="compass" id="compass"></div>
    </div>

    <div class="hud-el" id="el-streets" data-element="streets">
        <div class="streets" id="streets">
            <div class="streets__row">
                <span class="streets__dir" id="street-dir"></span>
                <span class="streets__name" id="street-name"></span>
                <span class="streets__cross" id="street-cross"></span>
            </div>
            <div class="streets__zone" id="street-zone"></div>
        </div>
    </div>


    <div class="hud-el" id="el-voice" data-element="voice">
        <div class="voice" id="voice">
            <svg class="voice__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/>
                <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
            </svg>
            <div class="voice__rings">
                <i class="voice__ring" data-level="1"></i>
                <i class="voice__ring" data-level="2"></i>
                <i class="voice__ring" data-level="3"></i>
            </div>
            <span class="voice__radio" id="voice-radio"></span>
        </div>
    </div>

    <div class="hud-el" id="el-vehicle" data-element="vehicle">
        <div class="vext" id="vehicle-extras"></div>
    </div>

    <div class="toasts" id="toasts"></div>
</div>

<!-- The drag editor -->
<div id="layout" class="layout" hidden>
    <div class="layout__grid" id="layout-grid"></div>
    <div class="layout__bar">
        <span class="layout__hint" id="layout-hint"></span>
        <label class="layout__snap">
            <input type="checkbox" id="layout-snap" checked>
            <span id="layout-snap-label"></span>
        </label>
        <button class="btn btn--ghost" id="layout-reset"></button>
        <button class="btn btn--primary" id="layout-done"></button>
    </div>
</div>

<!-- The settings menu -->
<div id="menu" class="menu" hidden>
    <div class="menu__panel" role="dialog" aria-modal="true">

        <header class="menu__head">
            <div class="menu__title">
                <h1 id="menu-title"></h1>
                <p id="menu-subtitle"></p>
            </div>
            <div class="menu__search">
                <input type="search" id="menu-search" autocomplete="off">
            </div>
            <button class="menu__close" id="menu-close" aria-label="close">&#10005;</button>
        </header>

        <div class="menu__body">
            <nav class="menu__tabs" id="menu-tabs"></nav>
            <div class="menu__content" id="menu-content"></div>
        </div>

        <footer class="menu__foot">
            <span class="menu__meta" id="menu-meta"></span>
            <div class="menu__actions">
                <button class="btn btn--ghost" id="menu-reset"></button>
                <button class="btn btn--primary" id="menu-done"></button>
            </div>
        </footer>

    </div>
</div>

gen": "#00fff0", "thirst": "#00b3ff", "health": "#39ff14", "text": "#eaffea", "stress": "#ff00e5", "speed": "#00e5ff", "background": "#05070a", "voice": "#ffffff", "fuel": "#ff9100", "rpm": "#ff003c", "stamina": "#c6ff00", "warning": "#ff003c", "armor": "#00e5ff", "hunger": "#ffcc00"}, "minimap": {"borders": true, "shape": "circle"}, "style": {"blur": 0, "direction": "column", "outline": true, "values": true, "icons": true, "gauge": "circle", "surface": "none", "corner": 999, "gap": 12, "glow": true}}, "modern": {"speedometer": {"style": "luxury"}, "compass": {"style": "bar"}, "colours": {"accent": "#3b82f6", "oxygen": "#06b6d4", "thirst": "#0ea5e9", "health": "#22c55e", "text": "#e5e7eb", "stress": "#8b5cf6", "speed": "#e5e7eb", "background": "#111418", "voice": "#9ca3af", "fuel": "#f97316", "rpm": "#ef4444", "stamina": "#84cc16", "warning": "#dc2626", "armor": "#3b82f6", "hunger": "#f59e0b"}, "minimap": {"borders": false, "shape": "square"}, "style": {"blur": 0, "direction": "column", "outline": false, "values": true, "icons": true, "gauge": "bar", "surface": "tint", "corner": 6, "gap": 6, "glow": false}}, "apex": {"speedometer": {"style": "digital"}, "compass": {"style": "tape"}, "colours": {"accent": "#ffb44c", "oxygen": "#6bcfe3", "thirst": "#6bcfe3", "health": "#61dcb2", "text": "#e7eef5", "stress": "#f28589", "speed": "#f4f7fa", "background": "#101820", "voice": "#dce8f2", "fuel": "#ffb44c", "rpm": "#ff675d", "stamina": "#b8d981", "warning": "#ff675d", "armor": "#79aaf7", "hunger": "#f2c370"}, "minimap": {"borders": true, "shape": "square"}, "style": {"blur": 0, "direction": "column", "outline": true, "values": true, "icons": true, "gauge": "segment", "surface": "solid", "corner": 5, "gap": 7, "glow": false}}, "heritage": {"speedometer": {"style": "classic"}, "compass": {"style": "dial"}, "colours": {"accent": "#d6b982", "oxygen": "#82bbbf", "thirst": "#82bbbf", "health": "#8ac5a8", "text": "#eee8d8", "stress": "#cc8f8b", "speed": "#eee8d8", "background": "#242a27", "voice": "#eee8d8", "fuel": "#d6b982", "rpm": "#b56a61", "stamina": "#b7c98b", "warning": "#c66e63", "armor": "#8ba8bc", "hunger": "#d6b982"}, "minimap": {"borders": true, "shape": "circle"}, "style": {"blur": 0, "direction": "column", "outline": true, "values": true, "icons": true, "gauge": "rounded", "surface": "tint", "corner": 8, "gap": 7, "glow": false}}};

    /* Stand in for the NUI endpoint. The real one is a fetch to https://v-hud/<name>. */
    const originalFetch = window.fetch;
    window.fetch = (url, options) => {
        const name = String(url).split('/').pop();
        let body = {};
        try { body = JSON.parse(options.body); } catch (e) { /* no body */ }
        handle(name, body);
        return Promise.resolve({ json: () => Promise.resolve({}) });
    };

    function deepSet(target, path, value) {
        const parts = path.split('.');
        let node = target;
        for (let i = 0; i < parts.length - 1; i += 1) node = node[parts[i]];
        node[parts[parts.length - 1]] = value;
    }

    function overlay(base, patch) {
        for (const [key, value] of Object.entries(patch || {})) {
            if (value && typeof value === 'object' && !Array.isArray(value)) {
                base[key] = base[key] || {};
                overlay(base[key], value);
            } else {
                base[key] = value;
            }
        }
        return base;
    }

    function push() {
        window.postMessage({ action: 'settings', settings, locked: STATIC.locked }, '*');
        syncControls();
    }

    function handle(name, body) {
        if (name === 'setPath') { deepSet(settings, body.path, body.value); push(); }
        else if (name === 'setPaths') {
            for (const [path, value] of Object.entries(body.changes)) deepSet(settings, path, value);
            push();
        }
        else if (name === 'applyTheme') { overlay(settings, THEMES[body.theme]); settings.theme = body.theme; push(); }
        else if (name === 'applyLayout') {
            const preset = STATIC.layouts.find((l) => l.key === body.layout);
            if (preset) settings.positions = JSON.parse(JSON.stringify(preset.positions));
            push();
        }
        else if (name === 'reset') { settings = JSON.parse(JSON.stringify(STATIC.defaults)); push(); }
        else if (name === 'resetSection') {
            const parts = body.section.split('.');
            let src = STATIC.defaults; let dst = settings;
            for (let i = 0; i < parts.length - 1; i += 1) { src = src[parts[i]]; dst = dst[parts[i]]; }
            dst[parts[parts.length - 1]] = JSON.parse(JSON.stringify(src[parts[parts.length - 1]]));
            push();
        }
        else if (name === 'close') { document.getElementById('menu').hidden = true; }
        else if (name === 'layoutMode') { /* the overlay drives itself */ }
    }

    /* Boot, then a tick loop that animates so the gauges and the speedometer move. */
    window.postMessage({ action: 'boot', static: STATIC, settings }, '*');
    window.postMessage({
        action: 'minimap', shape: settings.minimap.shape, borders: settings.minimap.borders,
        x: settings.minimap.x, y: settings.minimap.y, scale: settings.minimap.scale,
    }, '*');
    window.postMessage({
        action: 'streets', show: true, street: 'Vespucci Boulevard',
        crossing: 'Prosperity Street', zone: 'Vespucci Beach',
    }, '*');
    window.postMessage({ action: 'heading', cardinal: 'N' }, '*');
    window.postMessage({ action: 'route', metres: 3850 }, '*');
    window.postMessage({ action: 'showAccount', account: 'cash', amount: 24350, duration: 999999 }, '*');

    let t = 0;
    setInterval(() => {
        t += 0.05;
        const wave = (offset, span) => Math.round(50 + Math.sin(t + offset) * span);
        const inVehicle = document.getElementById('pv-vehicle').checked;
        const speed = Math.round(70 + Math.sin(t * 0.6) * 60);

        window.postMessage({
            action: 'tick',
            show: true,
            health: wave(0, 45), armor: wave(1, 40), hunger: wave(2, 35),
            thirst: wave(3, 38), stress: wave(4, 44), oxygen: wave(5, 30),
            stamina: wave(6, 40), underwater: false, sprinting: true,
            voiceRange: 2, talking: Math.sin(t) > 0, radio: 12, radioActive: true,
            armed: Math.sin(t * 0.4) > 0, parachute: -1, inVehicle,
            vehicle: inVehicle ? {
                speed, maxSpeed: 260, rpm: (Math.sin(t) + 1) / 2, gear: String(1 + (Math.floor(t) % 6)),
                fuel: Math.round(40 + Math.sin(t * 0.3) * 35), range: 180, engine: 82,
                seatbelt: Math.sin(t * 0.5) > 0, cruise: false, nitro: 60, nitroActive: Math.sin(t) > 0.6,
                // A door ajar and the bonnet up, on their own cycles, so the two warning
                // tell-tales are exercised rather than assumed.
                doors: { door: Math.sin(t * 0.35) > 0.2, bonnet: Math.sin(t * 0.2) > 0.6, boot: false },
                harness: 20, hasHarness: true, aircraft: false, bicycle: false, driver: true,
                lights: { on: true, high: false, left: Math.sin(t) > 0.7, right: false },
                // The odometer climbs, so the preview shows what a real one does rather than
                // a frozen number. A tick payload missing this hides the readout, which is
                // correct behaviour and was briefly mistaken for a bug.
                odometer: { value: Math.round(128450 + t * 3), unit: 'KM' },
            } : null,
        }, '*');

        window.postMessage({
            action: 'compass', show: true,
            degrees: Math.round((t * 12) % 360),
            cardinal: ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.floor(((t * 12) % 360) / 45)],
        }, '*');
    }, 50);

    /* The toolbar. */
    function option(select, value, label) {
        select.appendChild(Object.assign(document.createElement('option'), { value, textContent: label }));
    }

    const themeSelect = document.getElementById('pv-theme');
    for (const theme of STATIC.themes) option(themeSelect, theme.key, theme.label);
    themeSelect.addEventListener('change', () => handle('applyTheme', { theme: themeSelect.value }));

    const gauge = document.getElementById('pv-gauge');
    for (const shape of ['square', 'rounded', 'pill', 'circle', 'ring', 'radial',
                         'dot', 'bar', 'segment', 'diamond', 'hex', 'icon']) option(gauge, shape, shape);
    gauge.addEventListener('change', () => handle('setPath', { path: 'style.gauge', value: gauge.value }));

    const speedo = document.getElementById('pv-speedo');
    for (const entry of STATIC.speedometers) option(speedo, entry.key, entry.key);
    speedo.addEventListener('change', () => handle('setPath', { path: 'speedometer.style', value: speedo.value }));

    const compass = document.getElementById('pv-compass');
    for (const style of ['bar', 'tape', 'dial', 'text']) option(compass, style, style);
    compass.addEventListener('change', () => handle('setPath', { path: 'compass.style', value: compass.value }));

    const surface = document.getElementById('pv-surface');
    for (const kind of ['glass', 'tint', 'solid', 'none']) option(surface, kind, kind);
    surface.addEventListener('change', () => handle('setPath', { path: 'style.surface', value: surface.value }));

    function syncControls() {
        themeSelect.value = settings.theme;
        gauge.value = settings.style.gauge;
        speedo.value = settings.speedometer.style;
        compass.value = settings.compass.style;
        surface.value = settings.style.surface;
    }
    syncControls();

    document.getElementById('pv-menu').addEventListener('click', () => {
        window.postMessage({
            action: 'openMenu', settings, locked: STATIC.locked,
            // The modules this framework actually answers with, so the preview's provider
            // row shows what a player would see here rather than another framework's set.
            providers: { framework: 'v-core', fuel: 'v-vehicles', voice: 'v-voice',
                         notify: 'v-notify', sounds: 'v-3dsound', inventory: 'v-inventory' },
        }, '*');
    });

    document.getElementById('pv-layout').addEventListener('click', () => {
        window.postMessage({ action: 'layoutMode', on: true }, '*');
    });
})();
</script>

</body>
</html>
